[project]
name = "gentui"
version = "0.1.0"
description = "Terminal client for AG-UI agent backends"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "httpx>=0.28.1",
    "jsonpatch>=1.33",
    "textual>=8.2.8",
    "textual-plotext>=1.0.1",
]

[project.scripts]
gentui = "gentui.cli:main"
tui = "gentui.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]  # the example backend has its own tests and environment
