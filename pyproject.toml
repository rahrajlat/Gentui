[project]
name = "gentui"
version = "0.1.4"
description = "A terminal interface for prototyping agents really quickly, for any AG-UI backend"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rahrajlat" }]
keywords = ["ag-ui", "agents", "ai-agents", "tui", "terminal", "textual", "llm", "human-in-the-loop", "strands", "agentcore"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "httpx>=0.28.1",
    "jsonpatch>=1.33",
    "pyyaml>=6.0",
    "textual>=8.2.8",
    "textual-plotext>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/rahrajlat/Gentui"
Repository = "https://github.com/rahrajlat/Gentui"
Documentation = "https://github.com/rahrajlat/Gentui#readme"
Issues = "https://github.com/rahrajlat/Gentui/issues"
Changelog = "https://github.com/rahrajlat/Gentui/blob/main/CHANGELOG.md"

[project.scripts]
gentui = "gentui.cli:main"
tui = "gentui.cli:main"

[project.optional-dependencies]
agentcore = [
    "boto3>=1.40",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.43.108",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]  # the example backend has its own tests and environment
