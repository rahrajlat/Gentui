[project]
name = "gentui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jsonpatch>=1.33",
    "pydantic-settings>=2.15.0",
    "strands-agents[ollama]>=1.57.2",
    "strands-harness>=0.1.2",
    "textual>=8.2.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
gentui = "gentui:main"
server = "gentui.backend.app:main"
tui = "gentui.tui.app:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
